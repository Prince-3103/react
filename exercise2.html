<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      const container = document.querySelector('.js-container');


      function ProductDetails(props){
        const { productName, price, discountPrice, imageSrc } = props;
        return (
          <>
            <div>
              <img src={imageSrc} width="50" />
            </div>
            <p>{ productName }</p>
            { discountPrice ? (
                <>
                  <del>Price: ${ price }</del>
                  <p>Discount price: ${discountPrice}</p>
                </>
              )
              :
              <p>Price: ${ price }</p>
            }
            <button>Add to Cart</button>
          </>
        )
      }
      
      function App(){
        return (
          <>
            <ProductDetails 
              productName="Cotton socks" 
              price="10.90" 
              discountPrice="5.45" 
              imageSrc="./product-img/cotton-socks.png" 
            />
            <ProductDetails 
              productName="Plain T-Shirt" 
              price="7.99" 
              imageSrc="./product-img/plain-t-shirt.png" 
            />
            <ProductDetails 
              productName="Tennis Balls" 
              price="8.99" 
              imageSrc="./product-img/tennis-balls.png" 
            />            
          </>
        )
      }
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
