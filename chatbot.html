<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>

    <style>
      body{
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        margin: 0px;
      }

      .send-button{
        background-color: #198754;
        color: white;
        border: none;
        padding: 12px 20px;
        margin-left: 10px;
        border-radius: 10px;
        font-size: 15px;
        cursor: pointer;
      }
      .loading{
        height: 40px;
        margin: -15px;
      }
      .chat-input{
        padding: 12px 15px;
        border-radius: 10px;
        border-width: 1px;
        font-size: 15px;
        flex-grow: 1;
      }
      .chat-input-container{
        display: flex;
        margin-bottom: 60px;
      }

      .app-container{
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;

        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .user-message{
        display: flex;
        justify-content: end;
        align-items: start;
      }
      .robot-message{
        display: flex;
        align-items: start;
      }

      .text-message{
        padding: 15px 20px;
        background-color: rgb(223, 222, 222);
        border-radius: 10px;
        margin: 12px 10px;
        max-width: 300px;
      }

      .img-profile{
        width: 45px;
        margin-top: 10px;
      }
      
      .chat-message-container{
        flex-grow: 1;
        margin-top: 20px;
        overflow: scroll;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>


    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      const container = document.querySelector('.js-container');

      function ChatInput({chatMessages, setChatMessages}){

        const [inputText, setInputText] = React.useState("");
        const [isLoading, setIsLoading] = React.useState(false)

        function saveInputText(event){
          setInputText(event.target.value);
        }
        function handleKeyDown(event){
          if(event.key === "Enter"){
            sendMessage();
          }
          else if(event.key === "Escape"){
            setInputText('');
          }
        }

        async function sendMessage(){
          if(isLoading || inputText===''){
            return;
          }
          setIsLoading(true)
          setInputText("");

          const newChatMessage = [
            ...chatMessages,
            {
              message: inputText,
              sender: "user",
              id: crypto.randomUUID()
            }
          ];
          setChatMessages(newChatMessage)

          setChatMessages([
            ...newChatMessage,
            {
              message: <img src="/product-img/loading-spinner.gif" className="loading" />,
              sender: "robot",
              id: crypto.randomUUID()
            }
          ])
          

          const response = await Chatbot.getResponseAsync(inputText);
          setChatMessages([
            ...newChatMessage,
            {
              message: response,
              sender: "robot",
              id: crypto.randomUUID()
            }
          ])

          setIsLoading(false)

          setInputText("");
        }

        return (
          <div className="chat-input-container">
            <input 
              placeholder="Send a message to Chatbot" 
              size="30" 
              onChange={saveInputText}
              onKeyDown={handleKeyDown}
              value={inputText} 
              className="chat-input"
            />
            <button onClick={sendMessage} className="send-button">Send</button>  
          </div>
        );
      }

      function ChatMessage(props){
        // const message = props.message;
        // const sender = props.sender;
        const { message, sender } = props;

        // if(sender === "robot"){
        //   return (
        //     <div>
        //       <img src="robot.png" width="50" />
        //       {message}
        //     </div>
        //   )
        // }

        return (
          <div className={sender === 'user' ? 'user-message' : 'robot-message'}>
            { sender === 'robot' && <img src="robot.png" className="img-profile" /> }
            <div className="text-message">
              {message}
            </div>
            { sender === 'user' && <img src="chatbot.png" className="img-profile" />}
          </div>
        )
      }

      function useAutoScroll(dependencies){
        const chatMessagesRef = React.useRef(null);
        React.useEffect(() => {
          const containerElem = chatMessagesRef.current;
          if(containerElem){
            containerElem.scrollTop = containerElem.scrollHeight;
          }
        },[dependencies])

        return chatMessagesRef;
      }

      function ChatMessages({chatMessages}){
        const chatMessagesRef = useAutoScroll(chatMessages);

        if(chatMessages.length === 0){
          return (
            <h3 className="chat-message-container">Welcome to ChatBot project! Send a message using the textbox below.</h3>
          )
        }
  
        return (
          <div className="chat-message-container" ref={chatMessagesRef}>
            {chatMessages.map((chatMessage) => {
              return (
                <ChatMessage 
                  message={chatMessage.message} 
                  sender={chatMessage.sender} 
                  key={chatMessage.id}
                />
              );
            })}
          </div>
      )
      }

      function App(){
        const [chatMessages, setChatMessages] = React.useState([]);


        return (
          <div className="app-container">
            <ChatMessages chatMessages={chatMessages} />
            <ChatInput chatMessages={chatMessages} setChatMessages={setChatMessages} />
          </div>
        )
      }

      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
